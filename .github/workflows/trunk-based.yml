name: Trunk-Based Development

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  enforce-trunk-based:
    name: Enforce Trunk-Based Development
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for merge analysis

      - name: Verify PR targets main
        run: |
          if [ "${{ github.base_ref }}" != "main" ]; then
            echo "❌ PRs must target 'main' branch (trunk-based development)"
            echo "   Current target: ${{ github.base_ref }}"
            exit 1
          fi
          echo "✅ PR correctly targets main branch"

      - name: Check branch is up-to-date with main
        run: |
          git fetch origin main
          
          # Check if branch contains all commits from main
          BEHIND_COUNT=$(git rev-list --count HEAD..origin/main)
          
          if [ "$BEHIND_COUNT" -gt 0 ]; then
            echo "❌ Branch is $BEHIND_COUNT commit(s) behind main"
            echo "   Please rebase your branch onto main:"
            echo "   git fetch origin main && git rebase origin/main"
            exit 1
          fi
          echo "✅ Branch is up-to-date with main"

      - name: Verify fast-forward merge is possible
        run: |
          git fetch origin main
          
          # Get merge base
          MERGE_BASE=$(git merge-base HEAD origin/main)
          MAIN_HEAD=$(git rev-parse origin/main)
          
          # For fast-forward, main's HEAD must be the merge base
          if [ "$MERGE_BASE" != "$MAIN_HEAD" ]; then
            echo "❌ Fast-forward merge not possible"
            echo "   Branch has diverged from main. Please rebase:"
            echo "   git fetch origin main && git rebase origin/main"
            exit 1
          fi
          echo "✅ Fast-forward merge is possible"

      - name: Check for merge commits in branch
        run: |
          git fetch origin main
          MERGE_BASE=$(git merge-base HEAD origin/main)
          
          # Count merge commits (commits with more than one parent)
          MERGE_COMMITS=$(git rev-list --merges $MERGE_BASE..HEAD | wc -l)
          
          if [ "$MERGE_COMMITS" -gt 0 ]; then
            echo "⚠️  Warning: Branch contains $MERGE_COMMITS merge commit(s)"
            echo "   Consider using rebase instead of merge for a cleaner history"
            echo "   Merge commits found:"
            git rev-list --merges $MERGE_BASE..HEAD --oneline
          else
            echo "✅ No merge commits in branch (clean linear history)"
          fi

      - name: Check branch age
        run: |
          git fetch origin main
          MERGE_BASE=$(git merge-base HEAD origin/main)
          
          # Get age of merge base in days
          MERGE_BASE_DATE=$(git show -s --format=%ct $MERGE_BASE)
          CURRENT_DATE=$(date +%s)
          AGE_DAYS=$(( (CURRENT_DATE - MERGE_BASE_DATE) / 86400 ))
          
          if [ "$AGE_DAYS" -gt 3 ]; then
            echo "⚠️  Warning: Branch diverged from main $AGE_DAYS days ago"
            echo "   Trunk-based development recommends short-lived branches (< 3 days)"
            echo "   Consider breaking this into smaller PRs"
          else
            echo "✅ Branch age is acceptable ($AGE_DAYS days old)"
          fi
